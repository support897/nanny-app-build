# ---------- stage (vi): the delete leg is NOT in this flow --------------
# Per the registered spine shape, deletion runs from QA's chair
# against the real backend, not in Maestro — and on this app it
# rides the DEL-2-proven road (cs-del2-experiment.js): on the
# account page, the first tap on "Delete my account" opens the
# confirmation sheet and deletes nothing; a wrong proof speaks
# "That password does not match. Nothing was deleted." and stops;
# the true proof runs the extended walk to the deleted line.
# The close is QA's owner-side full-footprint read at 404 —
# users/{uid} + profiles/{uid} + meta/questionnaire + every walk
# path + _entitlements/{uid} included, per the fleet
# delete-verification law — reported beside this drive's
# SIMULATOR results, never inside them.
