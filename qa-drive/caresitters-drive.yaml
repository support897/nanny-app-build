# The FINISHING ORDER spine for candidate 117's simulator copy
# (bundle com.ilse.caresits, version 1.0, build 117; the copy's
# byte-leg pins stand in store-uploads/scratch/caresitters-sim/
# PINS.md). Spine: sign up -> the FULL family questionnaire journey
# driven to its Finish tap (the commit fires there — journey.js
# calls CARESITS_SAVE at the finish, F-CS-115-1) -> the Done screen
# + a settle beat on Home -> sign out -> sign in -> the committed
# questionnaire stands -> a SECOND account whose space holds none
# of it.
# Structural template: pace-drive.yaml v2 + mealprep-drive.yaml —
# every tap waits until its target is visible; sheets are waited
# for, dismissed non-optionally, and proven gone before anything
# behind them is touched.
# SETTLE DISCIPLINE (the b117 leg-2 setup artefact): finish()
# writes the done envelope and shows the Done screen BEFORE its
# save settles; a drive that navigates away inside that window
# kills the commit. This flow therefore stays on the Done screen
# until the Home card itself reads "Your questions are answered"
# — the seam-driven card is the settle proof, never a timer alone.
# TEST_EMAIL / TEST_PASSWORD / TEST_EMAIL2 / TEST_PASSWORD2 arrive
# as workflow env at dispatch (passwords from QA's mode-600 cast,
# sealed the Pace way); the values never appear in this file or
# the repo. NOTE: Maestro's commands.json records env values in
# plaintext — the workflow's collect step must NOT upload
# commands.json (the Pace v1 lesson; see pace-drive.yaml).
# Selector provenance for every string below:
# caresitters-drive-NOTES.md.
appId: com.ilse.caresits
---
# ---------- cold open: the door -------------------------------------
# Drive 1 (run 39942528123) died HERE, instrument/timing: the tagline
# assert waited its full 90 s without a match, yet the collect frame
# minutes later shows the door painted whole with the tagline standing
# (the fleet's slow-first-paint signature: NM black at frame 00, MP
# door-only, CS blank at the copy beat). The tagline is one element in
# the shipped markup (<p class="doorTag">, read at QA's hand), so the
# string is right; the window was short against a cold sim boot +
# WebView first paint. v2: a boot frame BEFORE the assert (evidence at
# the exact beat) + a 180 s window.
- launchApp:
    clearState: true
- takeScreenshot: 00a-boot
- extendedWaitUntil:
    visible:
      text: "Find care. Share the day."
    timeout: 180000
- takeScreenshot: 00-door
# ---------- stage (i): sign up, account 1 (email step, then ---------
# ---------- password step; the one button does both) ----------------
- tapOn:
    text: "you@example.com"
    waitUntilVisible: true
- inputText: "${TEST_EMAIL}"
- tapOn:
    point: "90%, 62%"  # WKWebView accessory Done (hideKeyboard class cure)
- takeScreenshot: 01-email-step
- tapOn:
    text: "Next"
    waitUntilVisible: true
    retryTapIfNoChange: true
- runFlow:
    when:
      visible: "That email looks unfinished. One more look?"
    commands:
      - tapOn:
          point: "42%, 66%"
      - eraseText: 40
      - inputText: "${TEST_EMAIL}"
      - tapOn:
          point: "90%, 62%"
      - tapOn:
          text: "Next"
          waitUntilVisible: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "That email looks unfinished. One more look?"
    commands:
      - tapOn:
          point: "42%, 66%"
      - eraseText: 40
      - inputText: "${TEST_EMAIL}"
      - tapOn:
          point: "90%, 62%"
      - tapOn:
          text: "Next"
          waitUntilVisible: true
- tapOn:
    text: "Your own password"
    waitUntilVisible: true
- inputText: "${TEST_PASSWORD}"
- tapOn:
    point: "90%, 58%"  # accessory Done, CENTRE MEASURED on drive 4 (the bar's tick sits at 58% on this door; 62% landed below the bar and the standing input session ate the Join tap)
- takeScreenshot: 02-password-step
- tapOn:
    text: "Join Caresitters"
    waitUntilVisible: true
# The creation announcement ("That email is new here, so we made
# your account. Welcome in.") is transient in #doorMsg; this frame
# is its evidence window, not an assertion (see NOTES).
- takeScreenshot: 03-join-tapped
# ---------- first entry: the tour -----------------------------------
# Five stops; the name is saved by the first Next tap. The sentinel
# name for this spine is typed here — ON A FRESH ACCOUNT. A returning
# account whose name already stands meets the tour wherever it
# stands (drive 6, run 39959129566: the tour stood at stop 2,
# "This is your menu", the Join tap's own retry having overshot
# into stop 1's Next — RETRY-TAP OVERSHOOT; the Join tap no longer
# carries a retry). Both shapes walk to the shared tail. The
# tour's presentation is judged first by its universal marker:
# every stop but the last carries a "Next" button.
- extendedWaitUntil:
    visible:
      text: "Next"
    timeout: 60000
- runFlow:
    when:
      visible: "Hello, I am the Caresitters bunny"
    commands:
      - tapOn:
          text: "Your name"
          waitUntilVisible: true
      - inputText: "Sim Driver CS"
      - tapOn:
          point: "90%, 62%"  # WKWebView accessory Done (hideKeyboard class cure)
      - takeScreenshot: 04-tour-name
      - tapOn:
          text: "Next"
          waitUntilVisible: true
      - tapOn:
          text: "Next"
          waitUntilVisible: true
      - tapOn:
          text: "Next"
          waitUntilVisible: true
      - tapOn:
          text: "Next"
          waitUntilVisible: true
- runFlow:
    when:
      visible: "This is your menu"
    commands:
      - tapOn:
          text: "Next"
          waitUntilVisible: true
      - tapOn:
          text: "Next"
          waitUntilVisible: true
      - tapOn:
          text: "Next"
          waitUntilVisible: true
- extendedWaitUntil:
    visible:
      text: "You are all set"
    timeout: 30000
- tapOn:
    text: "Done"
    waitUntilVisible: true
- extendedWaitUntil:
    notVisible:
      text: "You are all set"
    timeout: 30000
- takeScreenshot: 05-inside
