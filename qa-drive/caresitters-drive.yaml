# The FINISHING ORDER spine for candidate 117's simulator copy
# (bundle com.ilse.caresits, version 1.0, build 117; the copy's
# byte-leg pins stand in store-uploads/scratch/caresitters-sim/
# PINS.md). Spine: sign up -> the FULL family questionnaire journey
# driven to its Finish tap (the commit fires there — journey.js
# calls CARESITS_SAVE at the finish, F-CS-115-1) -> the Done screen
# + a settle beat on Home -> sign out -> sign in -> the committed
# questionnaire stands -> a SECOND account whose space holds none
# of it.
# Structural template: pace-drive.yaml v2 + mealprep-drive.yaml —
# every tap waits until its target is visible; sheets are waited
# for, dismissed non-optionally, and proven gone before anything
# behind them is touched.
# SETTLE DISCIPLINE (the b117 leg-2 setup artefact): finish()
# writes the done envelope and shows the Done screen BEFORE its
# save settles; a drive that navigates away inside that window
# kills the commit. This flow therefore stays on the Done screen
# until the Home card itself reads "Your questions are answered"
# — the seam-driven card is the settle proof, never a timer alone.
# TEST_EMAIL / TEST_PASSWORD / TEST_EMAIL2 / TEST_PASSWORD2 arrive
# as workflow env at dispatch (passwords from QA's mode-600 cast,
# sealed the Pace way); the values never appear in this file or
# the repo. NOTE: Maestro's commands.json records env values in
# plaintext — the workflow's collect step must NOT upload
# commands.json (the Pace v1 lesson; see pace-drive.yaml).
# Selector provenance for every string below:
# caresitters-drive-NOTES.md.
appId: com.ilse.caresits
